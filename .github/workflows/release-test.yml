name: Build test release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-test.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "shared/**"
      - "sadx-bridge/**"
      - "er-bridge/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: ringpass-dev-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: D:\a

    steps:
      - name: Clone RingPass into Windows-safe path
        run: |
          if (Test-Path "D:\a\ringpass") { Remove-Item "D:\a\ringpass" -Recurse -Force }
          git clone "https://github.com/${{ github.repository }}.git" "D:\a\ringpass"
          Set-Location "D:\a\ringpass"
          git checkout "${{ github.sha }}"

      - name: Clone SADX Mod Loader SDK
        run: |
          if (Test-Path "D:\a\sadx-mod-loader") { Remove-Item "D:\a\sadx-mod-loader" -Recurse -Force }
          git clone --depth 1 "https://github.com/X-Hax/sadx-mod-loader.git" "D:\a\sadx-mod-loader"

      - name: Configure SADX x86 and x86 tools
        run: |
          cmake -S "D:\a\ringpass" -B "D:\a\build-sadx" -A Win32 `
            -DRINGPASS_BUILD_SADX=ON `
            -DRINGPASS_BUILD_ER=OFF `
            -DRINGPASS_BUILD_TOOLS=ON `
            "-DSADX_MOD_LOADER_ROOT=D:\a\sadx-mod-loader"

      - name: Build SADX x86 and x86 tools
        run: |
          cmake --build "D:\a\build-sadx" --config Release --parallel

      - name: Run x86 protocol tests
        run: |
          ctest --test-dir "D:\a\build-sadx" -C Release --output-on-failure

      - name: Configure Elden Ring x64 and tools
        run: |
          cmake -S "D:\a\ringpass" -B "D:\a\build-er" -A x64 `
            -DRINGPASS_BUILD_SADX=OFF `
            -DRINGPASS_BUILD_ER=ON `
            -DRINGPASS_BUILD_TOOLS=ON

      - name: Build Elden Ring x64 and x64 tools
        run: |
          cmake --build "D:\a\build-er" --config Release --parallel

      - name: Run x64 protocol tests
        run: |
          ctest --test-dir "D:\a\build-er" -C Release --output-on-failure

      - name: Run x86-to-x64 IPC self test
        run: |
          $cross = "D:\a\cross-test"
          if (Test-Path $cross) { Remove-Item $cross -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cross | Out-Null

          $fakeSadx = Get-ChildItem "D:\a\build-sadx" -Recurse -Filter "FakeSADX.exe" | Select-Object -First 1
          $fakeEr = Get-ChildItem "D:\a\build-er" -Recurse -Filter "FakeER.exe" | Select-Object -First 1
          $selfTest = Get-ChildItem "D:\a\build-er" -Recurse -Filter "RingPassSelfTest.exe" | Select-Object -First 1

          if (-not $fakeSadx) { throw "Missing x86 FakeSADX.exe" }
          if (-not $fakeEr) { throw "Missing x64 FakeER.exe" }
          if (-not $selfTest) { throw "Missing RingPassSelfTest.exe" }

          Copy-Item -Force $fakeSadx.FullName "$cross\FakeSADX.exe"
          Copy-Item -Force $fakeEr.FullName "$cross\FakeER.exe"
          Copy-Item -Force $selfTest.FullName "$cross\RingPassSelfTest.exe"

          & "$cross\RingPassSelfTest.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Cross-bitness self test failed with exit code $LASTEXITCODE"
          }

      - name: Assemble downloadable package
        run: |
          $stage = "D:\a\ringpass-release"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }

          New-Item -ItemType Directory -Force -Path "$stage\SADX-Mod" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\EldenRing-Bridge" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\Tools" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\Docs" | Out-Null

          Copy-Item -Force "D:\a\build-sadx\package\RingPass-SADX\RingPassSADX.dll" "$stage\SADX-Mod\RingPassSADX.dll"
          Copy-Item -Force "D:\a\ringpass\sadx-bridge\mod.ini" "$stage\SADX-Mod\mod.ini"
          Copy-Item -Force "D:\a\build-er\package\elden-ring\RingPassER.dll" "$stage\EldenRing-Bridge\RingPassER.dll"

          $fakeSadx = Get-ChildItem "D:\a\build-sadx" -Recurse -Filter "FakeSADX.exe" | Select-Object -First 1
          $fakeEr = Get-ChildItem "D:\a\build-er" -Recurse -Filter "FakeER.exe" | Select-Object -First 1
          if (-not $fakeSadx) { throw "Missing x86 FakeSADX.exe" }
          if (-not $fakeEr) { throw "Missing x64 FakeER.exe" }

          Copy-Item -Force $fakeSadx.FullName "$stage\Tools\FakeSADX.exe"
          Copy-Item -Force $fakeEr.FullName "$stage\Tools\FakeER.exe"

          foreach ($name in @("RingPassMonitor.exe", "RingPassLauncher.exe", "RingPassSelfTest.exe")) {
            $file = Get-ChildItem "D:\a\build-er" -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { throw "Missing tool: $name" }
            Copy-Item -Force $file.FullName "$stage\Tools\$name"
          }

          Copy-Item -Recurse -Force "D:\a\ringpass\docs\*" "$stage\Docs"
          Copy-Item -Force "D:\a\ringpass\THIRD_PARTY.md" "$stage\THIRD_PARTY.md"

          $zip = "D:\a\RingPass-SADX-v0.4.0-dev.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingPass-SADX-v0.4.0-dev
          path: D:\a\RingPass-SADX-v0.4.0-dev.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.0-dev"
          $zip = "D:\a\RingPass-SADX-v0.4.0-dev.zip"
          $repo = "${{ github.repository }}"

          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $repo
          }
          else {
            gh release create $tag $zip --repo $repo --target "${{ github.sha }}" --title "RingPass-SADX v0.4.0-dev" --prerelease --notes @"
          Development package with both architectures.

          Includes:
          - SADX-Mod/RingPassSADX.dll (x86)
          - EldenRing-Bridge/RingPassER.dll (x64 bootstrap)
          - RingPassMonitor.exe
          - FakeSADX.exe
          - FakeER.exe
          - RingPassLauncher.exe
          - RingPassSelfTest.exe
          - build/simulation documentation

          CI validates x86 and x64 protocol tests plus an x86 FakeSADX -> x64 FakeER end-to-end IPC self test.
          "@
          }
