name: Build test release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-test.yml"
      - "CMakeLists.txt"
      - "shared/**"
      - "sadx-bridge/**"
      - "er-bridge/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout RingPass
        uses: actions/checkout@v4

      - name: Checkout SADX Mod Loader SDK
        uses: actions/checkout@v4
        with:
          repository: X-Hax/sadx-mod-loader
          path: _deps/sadx-mod-loader
          fetch-depth: 1

      - name: Configure Win32
        shell: pwsh
        run: >
          cmake -S . -B build -A Win32
          "-DSADX_MOD_LOADER_ROOT=$env:GITHUB_WORKSPACE/_deps/sadx-mod-loader"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Assemble downloadable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "release-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -Recurse -Force "build/package/RingPass-SADX" "$stage/RingPass-SADX"
          Copy-Item -Force "build/package/tools/RingPassMonitor.exe" "$stage/RingPassMonitor.exe"
          Copy-Item -Force "docs/BUILD_SADX.md" "$stage/README-INSTALL.txt"

          $zip = Join-Path $env:GITHUB_WORKSPACE "RingPass-SADX-v0.1.0-test.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingPass-SADX-v0.1.0-test
          path: RingPass-SADX-v0.1.0-test.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-test"
          $zip = "RingPass-SADX-v0.1.0-test.zip"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          }
          else {
            gh release create $tag $zip --target "$env:GITHUB_SHA" --title "RingPass-SADX v0.1.0-test" --prerelease --notes @"
          First downloadable RingPass-SADX test build.

          Includes:
          - RingPassSADX.dll
          - mod.ini
          - RingPassMonitor.exe

          This release validates live SADX character telemetry and shared-memory IPC before Elden Ring integration.
          "@
          }
